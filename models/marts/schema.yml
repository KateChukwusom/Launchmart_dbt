version: 2

models:
  - name: dim_customers
    description: "Customer dimension with behavior and loyalty metrics."
    columns:
      - name: customer_id
        description: "Customer identifier."
        tests:
          - not_null
          - unique
      - name: full_name
        description: "Customer full name."
      - name: email
        description: "Customer email."
        tests:
          - unique
      - name: customer_join_date
        description: "Date customer joined."
      - name: total_orders
        description: "Total number of orders placed."
      - name: total_items_purchased
        description: "Total number of items purchased."
      - name: first_order_date
        description: "Date of first order."
      - name: most_recent_order_date
        description: "Date of most recent order."
      - name: total_loyalty_points
        description: "Total loyalty points earned."
      - name: promo_points
        description: "Total promotional points earned."
      - name: standard_points
        description: "Total points from regular orders."

  - name: fct_orders
    description: "Order fact table for revenue analysis."
    columns:
      - name: order_id
        description: "Order identifier."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Customer identifier."
      - name: order_date
        description: "Order date."
      - name: order_revenue
        description: "Revenue generated from the order."
        tests:
          - revenue_not_negative
