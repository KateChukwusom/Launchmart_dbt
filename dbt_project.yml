
name: Launchmart_dbt
version: '1.0'
config-version: 2

profile: Launchmart_dbt_profile

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_modules"

models:
  Launchmart_dbt:
    # STAGING MODELS
    
    staging:
      +materialized: view
      +schema: "{{ target.schema }}_staging"

    
    # INTERMEDIATE MODEL
   
    intermediate:
      +materialized: view
      +schema: "{{ target.schema }}_intermediate"
   
    # MARTS MODEL
    
    marts:
      +materialized: table
      +schema: "{{ target.schema }}_marts"
  